<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/static/styles.css?v=rhythm-lab-20260915-ru-v1" />
  <script src="/static/app.js?v=rhythm-lab-20260915-ru-v1" defer></script>
  <title>Rhythm Lab</title>
</head>
<body>
  <header class="app-shell">
    <section class="top-bar">
      <div>
        <strong>Rhythm Lab</strong>
        <button id="shutdownLab" type="button" class="icon-button rhythm-lab-stop-button" title="Остановить Rhythm Lab" aria-label="Остановить Rhythm Lab">
          <svg class="lucide lucide-power" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v10" />
            <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />
          </svg>
        </button>
      </div>
      <div class="profile-controls">
        <select id="profileSelect" title="Активный профиль классификатора"></select>
        <button id="newProfile" type="button">Новый профиль</button>
        <button id="settingsTab" type="button">Настройки профиля</button>
        <button id="deleteProfile" type="button">Удалить</button>
      </div>
    </section>

    <section class="source-row">
      <input id="sourcePath" class="source-path" placeholder="C:\db\abstracted.sqlite" title="Существующая база dj-track-similarity (SQLite). Открывается только для чтения." />
      <button id="chooseSource" type="button" title="Выбрать существующую базу SQLite">Обзор</button>
      <button id="loadSource" type="button" title="Загрузить выбранную базу-источник">Загрузить базу</button>
      <div class="source-actions">
        <button id="trainingTab" type="button" class="tab-button">
          Обучение
        </button>
      </div>
    </section>

    <nav class="tabs">
      <button id="libraryTab" type="button" class="tab-button active">
        <svg class="lucide lucide-library-big" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="8" height="18" x="3" y="3" rx="1" />
          <path d="M7 3v18" />
          <path d="M20.4 18.9c.2.7-.2 1.4-.9 1.6l-3.7 1c-.7.2-1.4-.2-1.6-.9L9.1 5.1c-.2-.7.2-1.4.9-1.6l3.7-1c.7-.2 1.4.2 1.6.9Z" />
        </svg>
        Библиотека
      </button>
      <button id="candidatesTab" type="button" class="tab-button">
        <svg class="lucide lucide-sparkles" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594Z" />
          <path d="M20 2v4" />
          <path d="M22 4h-4" />
          <circle cx="4" cy="20" r="2" />
        </svg>
        Кандидаты
      </button>
      <button id="collectionTab" type="button" class="tab-button">
        <svg class="lucide lucide-list-checks" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 17 2 2 4-4" />
          <path d="M13 6h8" />
          <path d="M13 12h8" />
          <path d="M13 18h8" />
          <path d="m3 7 2 2 4-4" />
        </svg>
        Коллекция
      </button>
      <span id="collectionControls" class="collection-controls" hidden>
        <select id="collectionSelect" title="Коллекция для ревью"></select>
        <button id="deleteCollection" type="button" class="icon-button delete-collection" title="Удалить выбранную коллекцию. Метки останутся в активном профиле." aria-label="Удалить выбранную коллекцию">
          <svg class="lucide lucide-trash-2" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
        <span id="collectionStatus" class="meta"></span>
      </span>
    </nav>

    <section id="commonFilters" class="filters">
      <input id="query" placeholder="поиск по пути, названию, исполнителю" />
      <input id="bpmMin" type="number" min="0" step="0.1" placeholder="BPM от" title="Минимальный BPM по SONARA. Пусто — без нижней границы." />
      <input id="bpmMax" type="number" min="0" step="0.1" placeholder="BPM до" title="Максимальный BPM по SONARA. Пусто — без верхней границы." />
      <select id="label"></select>
    </section>

    <section id="candidateFilters" class="filters candidate-filters-placeholder">
      <select id="libraryOrder" title="Порядок библиотеки">
        <option value="normal" selected>Обычный порядок</option>
        <option value="random">Случайный</option>
      </select>
      <button id="shuffleLibraryOrder" type="button" class="icon-button shuffle-library-order" title="Перемешать случайный порядок" aria-label="Перемешать случайный порядок">
        <svg class="lucide lucide-shuffle" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m18 14 4 4-4 4" />
          <path d="m18 2 4 4-4 4" />
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7L14 7.7C14.8 6.6 16 6 17.4 6H22" />
          <path d="M2 6h1.9c.7 0 1.4.3 1.9.8L8 9" />
          <path d="M11.7 14.9 14 16.3c.8 1.1 2 1.7 3.4 1.7H22" />
        </svg>
      </button>
      <select id="candidatePredicted"></select>
      <select id="candidateMinBroken">
        <option value="positive_highest" selected>наибольшая положительная вероятность</option>
        <option value="negative_highest">наибольшая отрицательная вероятность</option>
        <option value="balanced">неуверенные / пограничные</option>
      </select>
      <input id="candidateMinPositive" type="number" min="0" max="1" step="0.05" value="0" title="Минимальная положительная вероятность" />
    </section>

    <section class="pager">
      <select id="pageSize">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="500">500</option>
      </select>
      <button id="prevPage" type="button">Назад</button>
      <button id="nextPage" type="button">Вперёд</button>
      <input id="pageNumber" class="page-number" type="number" min="1" step="1" value="1" title="Номер страницы" />
      <button id="load" type="button">Загрузить</button>
      <span id="pageInfo" class="meta"></span>
      <span id="summary" class="summary-strip">
        <span id="summaryCoverage"></span>
        <span id="summaryLabels"></span>
      </span>
    </section>
  </header>

  <main>
    <section id="guidancePanel" class="guidance-panel"></section>
    <section id="settingsPanel" class="settings-panel" hidden>
      <div class="settings-grid">
        <form id="profileForm" class="tool-panel">
          <h2>Профиль</h2>
          <label>Название <input id="profileNameInput" /></label>
          <label>Описание <textarea id="profileDescriptionInput"></textarea></label>
          <label>Префикс артефактов <input id="profileArtifactPrefixInput" /></label>
          <label>Новых меток для обучения <input id="profileTrainingMinAddedInput" type="number" min="1" step="1" value="50" /></label>
          <label>Минимум меток на класс для обучения <input id="profileTrainingMinLabelsInput" type="number" min="2" step="1" value="100" /></label>
          <button type="submit">Сохранить профиль</button>
        </form>
        <form id="renameLabelForm" class="tool-panel">
          <h2>Переименовать ключ метки</h2>
          <label>Текущая метка <select id="renameLabelSelect"></select></label>
          <label>Новый ключ <input id="renameLabelKeyInput" placeholder="lead_vocal" /></label>
          <label>Отображаемое имя <input id="renameLabelNameInput" placeholder="Ведущий вокал" /></label>
          <button type="submit">Переименовать метку</button>
        </form>
      </div>
    </section>
    <section id="trainingPanel" class="training-panel" hidden></section>
    <section id="tracks"></section>
  </main>

  <dialog id="profileDialog">
    <form id="newProfileForm" method="dialog" class="dialog-form">
      <h2>Новый профиль классификатора</h2>
      <label>Ключ <input id="newProfileKey" placeholder="vocal_presence" required /></label>
      <label>Название <input id="newProfileName" placeholder="Наличие вокала" required /></label>
      <label>Тип
        <select id="newProfileType">
          <option value="binary" selected>Бинарный</option>
          <option value="multiclass">Мультикласс</option>
        </select>
      </label>
      <label>Описание <textarea id="newProfileDescription" placeholder="Что должен распознавать этот классификатор"></textarea></label>
      <label>Новых меток для обучения <input id="newProfileTrainingMinAdded" type="number" min="1" step="1" value="50" required /></label>
      <label>Минимум меток на класс для обучения <input id="newProfileTrainingMinLabels" type="number" min="2" step="1" value="100" required /></label>
      <div id="binaryLabelGrid" class="label-grid">
        <label>Ключ положительной метки <input id="newPositiveKey" placeholder="vocal" required /></label>
        <label>Название положительной <input id="newPositiveName" placeholder="Вокал" required /></label>
        <label>Ключ отрицательной метки <input id="newNegativeKey" placeholder="instrumental" required /></label>
        <label>Название отрицательной <input id="newNegativeName" placeholder="Инструментал" required /></label>
        <label>Ключ метки для ревью <input id="newReviewKey" placeholder="uncertain" /></label>
        <label>Название метки для ревью <input id="newReviewName" placeholder="Неуверенно" /></label>
      </div>
      <div id="multiclassLabelEditor" class="multiclass-label-editor" hidden>
        <div id="multiclassLabelRows" class="multiclass-label-rows">
          <div class="multiclass-label-row">
            <label>Ключ класса <input class="multiclass-label-key" placeholder="euphoric" /></label>
            <label>Название класса <input class="multiclass-label-name" placeholder="Эйфория" /></label>
            <label>Описание <textarea class="multiclass-label-description" placeholder="Яркое, приподнятое настроение, руки вверх"></textarea></label>
          </div>
          <div class="multiclass-label-row">
            <label>Ключ класса <input class="multiclass-label-key" placeholder="dark" /></label>
            <label>Название класса <input class="multiclass-label-name" placeholder="Тёмный" /></label>
            <label>Описание <textarea class="multiclass-label-description" placeholder="Тёмное, напряжённое, приглушённое настроение"></textarea></label>
          </div>
        </div>
        <button id="addMulticlassLabel" type="button">Добавить класс</button>
      </div>
      <menu>
        <button id="cancelProfileButton" type="button" value="cancel">Отмена</button>
        <button id="createProfileButton" type="submit" value="default">Создать</button>
      </menu>
    </form>
  </dialog>
</body>
</html>
