name: CI

# The cheap verification tier from AGENTS.md, on demand.
#
# Manual trigger only, by author's choice: pushing to main must stay a plain
# push, with no run attached to it. Start this from the Actions tab when you
# want a clean-machine check — before a release, or when something looks off
# locally. Its value is that the runner is an empty machine, so it fails on
# anything that only works because a local environment already has it.
#
# Scope is deliberately the base install: no `ml` extra, so no torch, no CUDA
# wheels and no model checkpoints. Tests that need torch skip themselves through
# `pytest.importorskip`. Runners are Windows because that is the platform the
# project is developed and verified on; the suites have not been exercised on
# Linux.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pinned Python, base install)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The interpreter comes from uv, not `actions/setup-python`, because the
      # latter has no Windows build past 3.10.11: python.org stopped shipping
      # them, so a `python-version: "3.10"` runner would silently test against
      # SQLite 3.40.1 while development runs the version in `.python-version`.
      # `uv sync` reads that file and installs the exact pinned patch release.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `rhythm-lab` is included for scikit-learn only, `audio-online` for the
      # two packages its suite imports. The `ml` extra stays out: it pulls CUDA
      # torch wheels and is not needed by the suites below. The `sonara` extra
      # stays out too: its wheel is a local build path.
      - name: Install package
        run: uv sync --locked --extra dev --extra rhythm-lab --extra audio-online

      - name: Primary suite
        run: uv run --no-sync python -m pytest tests/

      # Root pytest collects only `tests/`, so these are named explicitly.
      - name: Script and tool suites
        run: uv run --no-sync python -m pytest scripts/tests tools/audio-dedup/tests tools/rhythm-lab/tests tools/audio-online/tests

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix ./frontend ci

      - name: Typecheck
        run: npm --prefix ./frontend run typecheck

      - name: Tests
        run: npm --prefix ./frontend test

      # AGENTS.md makes this mandatory before a commit; CI is the backstop.
      - name: Build
        run: npm --prefix ./frontend run build
