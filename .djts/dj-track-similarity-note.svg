<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DJ Track Similarity</title>
  <desc id="desc">A vivid red musical note on a deep charcoal tile.</desc>
  <defs>
    <linearGradient id="tile" x1="28" y1="18" x2="222" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A1820"/>
      <stop offset="1" stop-color="#100D12"/>
    </linearGradient>
    <linearGradient id="note" x1="84" y1="60" x2="186" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6A7D"/>
      <stop offset="0.48" stop-color="#FF304E"/>
      <stop offset="1" stop-color="#C91437"/>
    </linearGradient>
    <filter id="glow" x="52" y="34" width="156" height="196" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
