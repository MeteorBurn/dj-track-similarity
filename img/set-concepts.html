<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Ten set-building schemes for dj-track-similarity: how a text prompt, an audio embedding and SONARA together shape a DJ set.">
<title>DJ Track Similarity — Set Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* surface */
    --bg:#06090e; --bg-lift:#0a1017;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
    /* ink — every step clears 4.5:1 on --bg */
    --ink:#eef4f9; --ink-2:#c2cfdb; --ink-3:#93a3b3; --ink-4:#7e8e9d;
    /* signal key */
    --gold:#fbbf24; --violet:#a78bfa; --cyan:#22d3ee;
    /* per-scheme / per-card accent */
    --acc:#34d399; --acc2:#6ee7b7;
    --acc-soft:color-mix(in srgb,var(--acc) 8%,transparent);
    --acc-ink:color-mix(in srgb,var(--acc) 78%,#fff);
    /* motion */
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-in-out:cubic-bezier(.77,0,.175,1);
    --d-fast:160ms; --d-ui:200ms; --d-reveal:320ms; --d-draw:760ms; --stagger:55ms;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;caret-color:var(--cyan);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.17) transparent}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;background-image:
      radial-gradient(1000px 520px at 4% -6%, rgba(16,185,129,.09), transparent 62%),
      radial-gradient(1100px 560px at 52% -10%, rgba(139,92,246,.10), transparent 60%),
      radial-gradient(900px 520px at 100% 30%, rgba(244,114,182,.07), transparent 62%);
    background-attachment:fixed}
  .wrap{max-width:1600px;margin:0 auto;padding:30px clamp(16px,3vw,52px) 64px}

  /* ---- browser surfaces ---- */
  ::selection{background:rgba(52,211,153,.3);color:#fff}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
  .mono,.row .v,.ovmeta b,.layers .num,.chartnote,.tab .num,.gauge b,.keychip b{font-variant-numeric:tabular-nums}

  /* ---- top bar ---- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:11px;font-size:14.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
  .brand .bars{display:flex;align-items:flex-end;gap:2.5px;height:17px}
  .brand .bars i{width:2.5px;border-radius:2px;background:var(--cyan);display:block}
  .brand .n1{color:var(--cyan)}.brand .sep{color:#5b6b78;font-weight:500}.brand .n2{color:var(--ink-2)}
  .status{display:flex;align-items:center;gap:9px;padding:9px 17px;border-radius:999px;border:1px solid var(--line-2);
    background:rgba(255,255,255,.03);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 9px rgba(251,191,36,.8)}

  /* ---- tabs ---- */
  .tabs{position:sticky;top:0;z-index:20;display:flex;gap:7px;flex-wrap:wrap;padding:12px 0;margin-bottom:26px;
    background:linear-gradient(180deg,rgba(6,9,14,.96) 72%,rgba(6,9,14,0));backdrop-filter:blur(8px)}
  .tab{appearance:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line-2);background:rgba(255,255,255,.028);color:var(--ink-3);font-size:13px;font-weight:600;
    transition:background var(--d-ui) var(--ease-in-out),color var(--d-ui) var(--ease-in-out),
               border-color var(--d-ui) var(--ease-in-out),box-shadow var(--d-ui) var(--ease-in-out),transform var(--d-fast) var(--ease-out)}
  .tab .tg{width:26px;height:11px;flex:none;color:currentColor;opacity:.72;transition:opacity var(--d-ui) var(--ease-in-out)}
  .tab .num{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--ink-4)}
  .tab[aria-selected="true"]{color:#fff;border-color:color-mix(in srgb,var(--tc,#fff) 45%,transparent);
    background:color-mix(in srgb,var(--tc,#fff) 14%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--tc,#fff) 18%,transparent)}
  .tab[aria-selected="true"] .tg{color:var(--tc,#fff);opacity:1}
  .tab[aria-selected="true"] .num{color:var(--ink-2)}
  @media (hover:hover) and (pointer:fine){
    .tab:hover{background:rgba(255,255,255,.07);color:var(--ink);transform:translateY(-1px)}
    .tab:hover .tg{opacity:1}
  }

  /* ---- scheme head ---- */
  .view[hidden]{display:none}
  .titleline{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:clamp(34px,4vw,54px);line-height:1;font-weight:800;letter-spacing:-.024em;text-wrap:balance}
  h1 .grad{-webkit-background-clip:text;background-clip:text;color:transparent}
  .badge{padding:8px 15px;border-radius:9px;font-size:14px;font-weight:500;color:#c8b8fd;
    background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.34)}
  .sub{font-size:clamp(15px,1.2vw,18.5px);line-height:1.55;color:var(--ink-3);max-width:96ch;margin-bottom:26px;text-wrap:pretty}
  .sub b{color:var(--ink);font-weight:600}

  /* ---- chart ---- */
  .charthead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
  .seclabel{font-size:11.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
  .legend{display:flex;gap:20px;align-items:center;font-size:12.5px;color:var(--ink-3)}
  .legend span{display:flex;align-items:center;gap:8px}
  .legend .sw{width:26px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--violet));flex:none}
  .legend .sw.d{background:none;border-top:2px dashed #7d8d9c;height:0}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .chartnote{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink-4);letter-spacing:.04em;text-align:right;margin:8px 0 14px}
  .node{cursor:pointer}
  .node circle{transition:r var(--d-fast) var(--ease-out),filter var(--d-fast) var(--ease-out)}
  .node:hover circle.nc,.node.hot circle.nc{r:16}
  .node:hover circle,.node.hot circle{filter:drop-shadow(0 0 10px currentColor)}
  .guide{transition:stroke var(--d-fast) var(--ease-in-out)}
  .guide.hot{stroke:rgba(255,255,255,.42)}
  .dim{opacity:.34}
  .node,.card,.guide{transition:opacity var(--d-ui) var(--ease-in-out)}

  /* ---- headroom gauge ---- */
  .gauge{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:22px;background:rgba(255,255,255,.022)}
  .gauge .gh{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .gauge .gt{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
  .gauge .gn{font-size:12.5px;color:var(--ink-4);font-style:italic}
  .grow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
  .grow + .grow{margin-top:13px}
  .grow .gk{font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .gbars{display:flex;flex-direction:column;gap:7px;min-width:0}
  .gbar{display:grid;grid-template-columns:96px 1fr 52px;gap:11px;align-items:center;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4)}
  .gtrack{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
  .gfill{display:block;width:100%;height:100%;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 35%,transparent),var(--acc));
    transform-origin:left center;transform:scaleX(var(--v))}
  .gbar b{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink-2);letter-spacing:0;text-align:right}

  /* ---- transitions strip ---- */
  .ramp{display:flex;align-items:stretch;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:24px;
    background:linear-gradient(90deg,rgba(52,211,153,.06),rgba(139,92,246,.06) 55%,rgba(244,114,182,.07))}
  .ramp .tag{display:flex;align-items:center;gap:9px;padding:13px 18px;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;
    color:#dcc98f;font-weight:600;border-right:1px solid var(--line);background:rgba(251,191,36,.07);white-space:nowrap}
  .ramp .tag .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(251,191,36,.7);flex:none}
  .ramp .steps{display:flex;flex:1;align-items:stretch;flex-wrap:wrap}
  .ramp .step{flex:1;min-width:190px;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;font-size:13.5px;color:var(--ink-3);text-align:center;line-height:1.45}
  .ramp .step + .step{border-left:1px dashed var(--line-2)}
  .ramp .step b{color:var(--ink);font-weight:600}
  .ramp .step.hot{flex:2.4;background:rgba(251,191,36,.09);border-left:1px solid rgba(251,191,36,.35);border-right:1px solid rgba(251,191,36,.35);color:#d6c8a6}
  .ramp .step.hot b{color:#fde3a0}
  .ramp .chip{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#0b1117;background:var(--gold);padding:4px 9px;border-radius:6px;white-space:nowrap}
  .ramp .chip.cool{background:linear-gradient(90deg,#5eead4,#38bdf8)}

  /* ---- stage cards ---- */
  .cards{display:grid;gap:16px;align-items:stretch;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
  .cards[data-n="2"]{--cols:2} .cards[data-n="3"]{--cols:3} .cards[data-n="4"]{--cols:4} .cards[data-n="5"]{--cols:5}
  .cards.blend{grid-template-columns:1fr 1.12fr 1fr}
  .card{background:linear-gradient(180deg,rgba(17,24,33,.85),rgba(10,15,21,.7));border:1px solid var(--line);border-radius:14px;
    position:relative;overflow:hidden;min-width:0;
    transition:transform var(--d-fast) var(--ease-out),border-color var(--d-ui) var(--ease-in-out),box-shadow var(--d-ui) var(--ease-in-out),opacity var(--d-ui) var(--ease-in-out)}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc);z-index:2}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:130px;background:linear-gradient(180deg,var(--acc-soft),transparent);pointer-events:none}
  .card > *{position:relative;z-index:1}
  .card.peak{border-color:color-mix(in srgb,var(--acc) 36%,transparent)}
  @media (hover:hover) and (pointer:fine){
    .card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 42%,transparent);
      box-shadow:0 16px 42px rgba(0,0,0,.5),0 0 32px var(--acc-soft)}
  }
  .cardhead{padding:17px 17px 14px}
  .stage{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--acc-ink);margin-bottom:7px}
  .cname{font-size:clamp(17px,1.35vw,21px);font-weight:700;letter-spacing:-.012em;line-height:1.2}
  .sec{padding:13px 17px;border-top:1px solid var(--line)}
  .sec:last-child{padding-bottom:17px}
  .slab{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
  .slab .d{width:6px;height:6px;border-radius:2px;flex:none;background:var(--sd)}
  .slab .model{margin-left:auto;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.02em;text-transform:none}
  .model.prompt{color:#c8b8fd;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.32)}
  .model.emb{color:#7fe9f8;background:rgba(34,211,238,.13);border:1px solid rgba(34,211,238,.3)}
  .quote{display:flex;gap:8px;font-size:clamp(14px,1.05vw,15.5px);font-style:italic;color:var(--ink);line-height:1.4}
  .quote .q{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-style:normal;line-height:.92;color:var(--violet);opacity:.85;flex:none}
  .layers{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
  .layers .num{font-size:clamp(24px,2.1vw,31px);font-weight:800;letter-spacing:-.02em;line-height:1;
    background:linear-gradient(95deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .layers .of{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);line-height:1.25;font-weight:600}
  .strip{display:flex;gap:2.5px;margin-bottom:10px}
  .strip i{flex:1;height:8px;border-radius:2px;background:rgba(255,255,255,.07);display:block}
  .strip i.on{background:var(--acc);box-shadow:0 0 7px color-mix(in srgb,var(--acc) 55%,transparent)}
  .cap{font-size:13.5px;color:var(--ink-2);line-height:1.4}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:baseline;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
  .row .dots{flex:1;margin:0 8px;border-bottom:2px dotted rgba(255,255,255,.22);transform:translateY(-4px)}
  .row .v{font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;white-space:nowrap}
  .row .v.gold{color:var(--gold)}

  /* ---- transition engine (scheme #2) ---- */
  .engine{background:linear-gradient(180deg,rgba(28,22,10,.75),rgba(12,12,14,.7));border:1px solid rgba(251,191,36,.28);border-radius:14px;padding:17px;min-width:0}
  .engine .stage{color:var(--gold)}
  .estep{display:flex;gap:12px;padding:12px 13px;border-radius:11px;background:rgba(255,255,255,.028);margin-bottom:9px}
  .estep .n{flex:none;width:23px;height:23px;border-radius:50%;background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.42);
    color:var(--gold);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .estep h4{font-size:15px;font-weight:700;margin-bottom:4px}
  .estep p{font-size:13px;line-height:1.45;color:var(--ink-3)}
  .estep p em{color:var(--ink-2);font-style:italic}
  .eresult{display:flex;gap:10px;align-items:baseline;padding:12px 13px;border-radius:11px;border:1px solid rgba(52,211,153,.28);
    background:rgba(52,211,153,.07);font-size:13px;color:#cfe0d9;line-height:1.45}
  .eresult b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6ee7b7;font-weight:700;white-space:nowrap}
  .rolebox{margin:0 17px 17px;padding:12px 14px;border-radius:11px;border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);
    background:color-mix(in srgb,var(--acc) 7%,transparent)}
  .rolebox .rl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-ink);font-weight:700;margin-bottom:7px}
  .rolebox .rt{font-size:13.5px;color:var(--ink-2);line-height:1.45}
  .vibebar{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:10px;margin-bottom:22px;
    border:1px solid rgba(139,92,246,.3);background:linear-gradient(90deg,rgba(139,92,246,.10),rgba(34,211,238,.08));
    font-size:13px;letter-spacing:.06em;color:#cec4ea;text-transform:uppercase;font-weight:600;text-align:center}
  .vibebar em{font-style:italic;color:#e9e1ff;text-transform:none;letter-spacing:0}
  .meter .mrow{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:7px}
  .meter .mrow b{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;color:var(--gold);letter-spacing:0}
  .mtrack{height:6px;border-radius:4px;background:rgba(255,255,255,.08);position:relative;margin-bottom:12px}
  .mfill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:linear-gradient(90deg,rgba(251,191,36,.35),var(--gold))}
  .mfill::after{content:"";position:absolute;right:-5px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(251,191,36,.8)}

  /* ---- overview ---- */
  .group{margin-bottom:34px}
  .grouphead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .grouphead h2{font-size:15px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-2)}
  .grouphead p{font-size:13.5px;color:var(--ink-4)}
  .ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
  .ovcard{cursor:pointer;text-align:left;font-family:inherit;background:linear-gradient(180deg,rgba(17,24,33,.85),rgba(10,15,21,.7));
    border:1px solid var(--line);border-radius:14px;padding:19px;position:relative;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;gap:12px;
    transition:transform var(--d-fast) var(--ease-out),border-color var(--d-ui) var(--ease-in-out),box-shadow var(--d-ui) var(--ease-in-out)}
  .ovcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc)}
  @media (hover:hover) and (pointer:fine){
    .ovcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 16px 44px rgba(0,0,0,.5)}
  }
  .ovcard .ovtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .ovcard .no{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:.14em;color:var(--acc-ink)}
  .ovcard .ovshape{font-size:11.5px;color:var(--ink-4);text-align:right}
  .ovcard h3{font-size:21px;font-weight:700;letter-spacing:-.014em;line-height:1.15}
  .ovcard .ovs{font-size:13.5px;color:var(--ink-3);line-height:1.5;flex:1}
  .ovcard svg.spark{width:100%;height:52px;display:block}
  .ovmeta{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-4);
    padding-top:12px;border-top:1px solid var(--line)}
  .ovmeta b{font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--ink-2);letter-spacing:0;font-weight:500}
  .ovhint{font-size:13.5px;color:var(--ink-4)}

  /* ---- footer ---- */
  .foot{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
  .keys{display:flex;gap:26px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3)}
  .keys span{display:flex;align-items:center;gap:9px}
  .keys i{width:8px;height:8px;border-radius:50%;display:block;flex:none}
  .keys b{color:var(--ink);font-weight:700}
  .note{font-size:13.5px;color:var(--ink-4);font-style:italic}
  kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--ink-2)}

  /* ---- motion: one authored moment per view ---- */
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes appear{from{opacity:0}to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes gauge-in{from{transform:scaleX(0)}to{transform:scaleX(var(--v))}}
  .reveal{opacity:0}
  .view.live .reveal{animation:rise var(--d-reveal) var(--ease-out) both;animation-delay:calc(var(--i,0) * var(--stagger))}
  .draw{stroke-dasharray:1;stroke-dashoffset:1}
  .view.live .draw{animation:draw var(--d-draw) var(--ease-out) both}
  .view.live .fade-late{animation:appear var(--d-reveal) linear both;animation-delay:calc(var(--d-draw) * .62)}
  .view.live .gfill{animation:gauge-in 520ms var(--ease-out) both;animation-delay:calc(var(--d-draw) * .5)}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .view.live .reveal,.view.live .fade-late{animation:appear 180ms linear both;animation-delay:0ms}
    .view.live .draw{animation:none;stroke-dashoffset:0}
    .view.live .gfill{animation:none;transform:scaleX(var(--v))}

/* ============================ geometry helpers ============================ */
const W = 1496, H = 210;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rad = d => (d-90)*Math.PI/180;

const smooth = pts => {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
};
const centers = (n, w=W, gap=16) => {
  const col = (w - (n-1)*gap)/n;
  return Array.from({length:n}, (_,i)=> i*(col+gap) + col/2);
};
const rails = (n, w=W, pad=30) =>
  Array.from({length:n}, (_,i)=>[i*w/n + pad, (i+1)*w/n - pad]);

/* a drawn caution mark — no glyph fonts */
const cautionMark = (x,y,c='#fbbf24') =>
  `<g transform="translate(${x} ${y})" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round">
     <path d="M0 -4.6 L4.6 0 L0 4.6 L-4.6 0 Z"/><path d="M0 -1.9 L0 .6" stroke-linecap="round"/>
   </g><circle cx="${x}" cy="${y+2.9}" r="1" fill="${c}"/>`;

/* ============================ chart: curve & step ============================ */
function curveSVG(s){
  const n = s.stages.length, step = s.form === 'step';
  const xs = step ? rails(n).map(r=>(r[0]+r[1])/2) : centers(n);
  const eY = e => 162 - e*134;
  const tmin = Math.min(...s.tempo), tmax = Math.max(...s.tempo), flat = tmax - tmin < .01;
  const tY = t => flat ? 172 : 194 - (t-tmin)/(tmax-tmin)*54;
  const gid = 'g'+s.n;
  const stops = s.stages.map((st,i)=>`<stop offset="${(i/(n-1)*100).toFixed(0)}%" stop-color="${st.acc}"/>`).join('');

  let dCurve, dArea;
  if (step){
    const rs = rails(n);
    let d = '';
    rs.forEach((r,i)=>{
      const y = eY(s.energy[i]);
      d += (i ? ` L${r[0].toFixed(0)} ${y.toFixed(1)}` : `M${r[0].toFixed(0)} ${y.toFixed(1)}`);
      d += ` L${r[1].toFixed(0)} ${y.toFixed(1)}`;
    });
    dCurve = d;
    dArea = d + ` L${rs[n-1][1].toFixed(0)} ${H} L${rs[0][0].toFixed(0)} ${H} Z`;
  } else {
    const pts = xs.map((x,i)=>[x, eY(s.energy[i])]);
    const head = [0, clamp(pts[0][1] + (pts[0][1]-pts[1][1])*.45, 14, 198)];
    const tail = [W, clamp(pts[n-1][1] + (pts[n-1][1]-pts[n-2][1])*.45, 14, 198)];
    dCurve = smooth([head, ...pts, tail]);
    dArea = dCurve + ` L${W} ${H} L0 ${H} Z`;
  }

  const tp = [[0, tY(s.tempo[0])], ...xs.map((x,i)=>[x, tY(s.tempo[i])]), [W, tY(s.tempo[n-1])]];
  const dTempo = tp.map((p,i)=>(i?'L':'M')+p[0].toFixed(0)+' '+p[1].toFixed(1)).join(' ');

  let deco = '';
  if (s.band){
    deco += `<rect x="1" y="16" width="${W-2}" height="118" rx="8" fill="none" stroke="rgba(255,255,255,.14)" stroke-dasharray="6 6"/>
      <text class="sm" x="16" y="34" font-family="JetBrains Mono" font-size="11" letter-spacing=".15em" fill="#8695a4">${s.band.toUpperCase()}</text>`;
  }
  (s.peakGlow||[]).forEach(i=>{
    deco += `<ellipse cx="${xs[i].toFixed(0)}" cy="${(eY(s.energy[i])+42).toFixed(0)}" rx="238" ry="148" fill="url(#pg${s.n})"/>`;
  });
  if ((s.peakGlow||[]).length === 1){
    const i = s.peakGlow[0];
    deco += `<text class="sm" x="${(xs[i]-52).toFixed(0)}" y="204" text-anchor="middle" font-family="JetBrains Mono" font-size="11" letter-spacing=".16em" fill="#a4818f">PEAK ZONE</text>`;
  }
  if ((s.peakGlow||[]).length > 1){
    s.peakGlow.forEach((i,j)=>{
      deco += `<text class="sm" x="${xs[i].toFixed(0)}" y="206" text-anchor="middle" font-family="JetBrains Mono" font-size="11" letter-spacing=".16em" fill="#a4818f">SUMMIT ${j?'II':'I'}</text>`;
    });
  }

  let markers = '';
  (s.marker||[]).forEach(m=>{
    const mx = (xs[m.after] + xs[m.after+1])/2;
    markers += `<path d="M${mx.toFixed(0)} 24 L${mx.toFixed(0)} ${H}" stroke="rgba(251,191,36,.55)" stroke-width="1.6" stroke-dasharray="6 5"/>
      <rect x="${(mx-102).toFixed(0)}" y="0" width="204" height="26" rx="13" fill="rgba(251,191,36,.12)" stroke="rgba(251,191,36,.5)"/>
      ${cautionMark(mx-78, 13)}
      <text x="${(mx+8).toFixed(0)}" y="17" text-anchor="middle" font-size="11.5" font-weight="600" letter-spacing=".12em" fill="#fbbf24">${m.label}</text>`;
  });

  let terraces = '';
  if (step && s.terraceLabels){
    rails(n).forEach((r,i)=>{
      const cx = (r[0]+r[1])/2, y = eY(s.energy[i]);
      terraces += `<text class="sm" x="${cx.toFixed(0)}" y="${(y-24).toFixed(0)}" text-anchor="middle" font-family="JetBrains Mono" font-size="11.5"
        letter-spacing=".1em" fill="#8695a4">${s.terraceLabels[i]}</text>`;
    });
    for (let i=1;i<n;i++){
      const x = i*W/n;
      terraces += `<path d="M${x.toFixed(0)} 18 L${x.toFixed(0)} ${H}" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`;
    }
  }

  const guides = xs.map((x,i)=>
    `<path class="guide" data-i="${i}" d="M${x.toFixed(0)} ${eY(s.energy[i]).toFixed(1)} L${x.toFixed(0)} ${H}" stroke="rgba(255,255,255,.13)" stroke-width="1" stroke-dasharray="4 5"/>`).join('');
  const bpm = xs.map((x,i)=> s.tempoLabels && s.tempoLabels[i]
    ? `<text x="${x.toFixed(0)}" y="${((flat?172:tY(s.tempo[i]))-16).toFixed(0)}" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#a3b4c5">${s.tempoLabels[i]}</text>` : '').join('');
  const nodes = s.stages.map((st,i)=>{
    const x = xs[i], y = eY(s.energy[i]), r = st.peak ? 14.5 : 13;
    return `<g class="node" data-i="${i}" style="color:${st.acc}" role="button" tabindex="0" aria-label="Stage ${i+1}: ${st.title}">
      <circle class="nc" cx="${x.toFixed(0)}" cy="${y.toFixed(1)}" r="${r}" fill="#0a1017" stroke="${st.acc}" stroke-width="${st.peak?2.6:2.2}"/>
      <text x="${x.toFixed(0)}" y="${(y+5).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${i+1}</text></g>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Inter" role="img"
      aria-label="${s.titleA}${s.titleB}: ${s.shape}, ${s.tempoSpan}">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="${W}" y2="0" gradientUnits="userSpaceOnUse">${stops}</linearGradient>
      <linearGradient id="a${s.n}" x1="0" y1="0" x2="0" y2="${H}" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="${s.stages[Math.floor(n/2)].acc}" stop-opacity=".18"/>
        <stop offset="1" stop-color="${s.stages[Math.floor(n/2)].acc}" stop-opacity="0"/></linearGradient>
      <radialGradient id="pg${s.n}"><stop offset="0" stop-color="#f472b6" stop-opacity=".22"/>
        <stop offset=".45" stop-color="#f472b6" stop-opacity=".09"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
      <filter id="gl${s.n}" x="-20%" y="-60%" width="140%" height="240%">
        <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g class="fade-late">${deco}<path d="${dArea}" fill="url(#a${s.n})"/></g>
    <path class="draw" pathLength="1" d="${dTempo}" stroke="#7d8d9c" stroke-width="2" stroke-dasharray="1" fill="none"/>
    <path class="draw" pathLength="1" d="${dCurve}" stroke="url(#${gid})" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#gl${s.n})"/>
    <g class="fade-late">${markers}${terraces}${guides}${bpm}${nodes}</g>
  </svg>`;
}

/* ============================ chart: Camelot wheel ============================ */
function wheelSVG(s){
  const cx = 226, cy = 202, R = [80,138,196];   /* inner A ring, boundary, outer B ring */
  const visited = s.wheel;
  const accOf = i => s.stages[i].acc;
  const idxOf = (k,ring) => visited.findIndex(v=>v.k===k && v.ring===ring);

  const sector = (k, ring) => {
    const a0 = (k-1)*30 - 15, a1 = a0 + 30;
    const [r0,r1] = ring === 'A' ? [R[0],R[1]] : [R[1],R[2]];
    const p = (r,a)=>[(cx+r*Math.cos(rad(a))).toFixed(1),(cy+r*Math.sin(rad(a))).toFixed(1)];
    const A=p(r0,a0), B=p(r0,a1), Cc=p(r1,a1), D=p(r1,a0);
    return `M${A} A${r0} ${r0} 0 0 1 ${B} L${Cc} A${r1} ${r1} 0 0 0 ${D} Z`;
  };
  const mid = (k, ring) => {
    const r = ring === 'A' ? (R[0]+R[1])/2 : (R[1]+R[2])/2, a = (k-1)*30;
    return [cx + r*Math.cos(rad(a)), cy + r*Math.sin(rad(a))];
  };

  let cells = '';
  for (let k=1;k<=12;k++){
    for (const ring of ['A','B']){
      const i = idxOf(k,ring), on = i >= 0;
      const [mx,my] = mid(k,ring);
      cells += `<path d="${sector(k,ring)}" fill="${on ? accOf(i) : 'rgba(255,255,255,.028)'}" fill-opacity="${on ? .3 : 1}"
        stroke="${on ? accOf(i) : 'rgba(255,255,255,.08)'}" stroke-width="${on ? 1.8 : 1}"/>
        <text class="sm" x="${mx.toFixed(1)}" y="${(my+(on?-6:5)).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono" font-size="14"
          font-weight="${on?700:400}" fill="${on ? '#fff' : '#7d8d9c'}">${k}${ring}</text>`;
    }
  }

  const path = visited.map((v,i)=>{
    const [x,y] = mid(v.k, v.ring);
    return (i?'L':'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join(' ');
  const dots = visited.map((v,i)=>{
    const [x,y] = mid(v.k, v.ring);
    return `<circle cx="${x.toFixed(1)}" cy="${(y+9).toFixed(1)}" r="11" fill="#0a1017" stroke="${accOf(i)}" stroke-width="2.2"/>
      <text x="${x.toFixed(1)}" y="${(y+13.6).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${i+1}</text>`;
  }).join('');

  /* ledger: the same five keys as a horizontal walk, so the moves are readable */
  const lx = 580, step = (W - lx - 46) / (visited.length - 1);
  let ledger = '';
  visited.forEach((v,i)=>{
    const x = lx + i*step, y = 172;
    if (i){
      ledger += `<path d="M${(x-step+50).toFixed(0)} ${y} L${(x-50).toFixed(0)} ${y}" stroke="rgba(255,255,255,.2)" stroke-width="1.5" stroke-dasharray="5 5"/>
        <text class="sm" x="${(x-step/2).toFixed(0)}" y="${y-20}" text-anchor="middle" font-family="JetBrains Mono" font-size="14"
          letter-spacing=".08em" fill="#93a3b3">${v.move}</text>`;
    }
    ledger += `<g class="node" data-i="${i}" style="color:${accOf(i)}" role="button" tabindex="0" aria-label="Stage ${i+1}: ${v.name}">
      <circle cx="${x.toFixed(0)}" cy="${y}" r="38" fill="#0a1017" stroke="${accOf(i)}" stroke-width="2.4"/>
      <text x="${x.toFixed(0)}" y="${y-3}" text-anchor="middle" font-family="JetBrains Mono" font-size="20" font-weight="700" fill="#fff">${v.code}</text>
      <text class="sm" x="${x.toFixed(0)}" y="${y+17}" text-anchor="middle" font-size="13" fill="#c2cfdb">${v.name}</text></g>
      <text class="sm" x="${x.toFixed(0)}" y="${y+62}" text-anchor="middle" font-family="JetBrains Mono" font-size="14" fill="#93a3b3">126 BPM</text>`;
  });

  return `<svg viewBox="0 0 ${W} 412" xmlns="http://www.w3.org/2000/svg" font-family="Inter" role="img"
      aria-label="Camelot wheel walk: 8A, 9A, 9B, 10B, 10A at a fixed 126 BPM">
    <g class="fade-late">${cells}
      <text class="sm" x="${cx}" y="${cy-6}" text-anchor="middle" font-size="13" font-weight="700" letter-spacing=".16em" fill="#93a3b3">CAMELOT</text>
      <text class="sm" x="${cx}" y="${cy+13}" text-anchor="middle" font-size="12.5" letter-spacing=".08em" fill="#7e8e9d">A minor · B major</text>
      <text class="sm" x="${(cx+R[2]+34).toFixed(0)}" y="${(cy-R[2]+34).toFixed(0)}" font-size="13" letter-spacing=".14em" fill="#7e8e9d">THE WALK</text>
    </g>
    <path class="draw" pathLength="1" d="${path}" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="1" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="fade-late">${dots}${ledger}</g>
  </svg>`;
}

/* ============================ chart: strata ============================ */
function strataSVG(s){
  const n = s.stages.length, x0 = 178, span = W - x0 - 8;
  const colW = span / n;
  const top = 26, bandH = 30, gap = 6;
  const accOf = i => s.stages[i].acc;

  let bands = '', defs = '';
  s.strata.forEach((st,j)=>{
    const y = top + j*(bandH+gap);
    const endX = x0 + st.last*colW;
    const id = `st${s.n}_${j}`;
    defs += `<linearGradient id="${id}" x1="${x0}" y1="0" x2="${endX}" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="${accOf(0)}" stop-opacity=".55"/>
      <stop offset=".62" stop-color="${accOf(Math.max(0,st.last-1))}" stop-opacity=".5"/>
      <stop offset="1" stop-color="${accOf(Math.max(0,st.last-1))}" stop-opacity="0"/></linearGradient>`;
    bands += `<rect x="0" y="${y}" width="${W}" height="${bandH}" rx="6" fill="rgba(255,255,255,.022)"/>
      <rect x="${x0}" y="${y}" width="${(endX-x0).toFixed(0)}" height="${bandH}" rx="6" fill="url(#${id})"/>
      <text class="sm" x="16" y="${y+bandH/2+4.5}" font-size="13" font-weight="600" letter-spacing=".14em" fill="${st.last===n?'#c2cfdb':'#93a3b3'}">${st.name.toUpperCase()}</text>
      <text class="sm" x="${(st.last===n ? W-14 : endX+12).toFixed(0)}" y="${y+bandH/2+4.5}" text-anchor="${st.last===n?'end':'start'}"
        font-family="JetBrains Mono" font-size="12.5" fill="#7e8e9d">${st.last===n?'held to the end':'ends at '+st.last}</text>`;
    if (st.last < n){
      bands += `<path d="M${endX.toFixed(0)} ${y-2} L${endX.toFixed(0)} ${y+bandH+2}" stroke="rgba(255,255,255,.22)" stroke-width="1.2" stroke-dasharray="3 4"/>`;
    }
  });

  const baseY = top + s.strata.length*(bandH+gap) + 22;
  let cols = '', nodes = '';
  for (let i=0;i<n;i++){
    const cx = x0 + (i+.5)*colW;
    cols += `<path class="guide" data-i="${i}" d="M${cx.toFixed(0)} ${top-8} L${cx.toFixed(0)} ${baseY}" stroke="rgba(255,255,255,.1)" stroke-width="1" stroke-dasharray="4 5"/>`;
    nodes += `<g class="node" data-i="${i}" style="color:${accOf(i)}" role="button" tabindex="0" aria-label="Stage ${i+1}: ${s.stages[i].title}">
      <circle class="nc" cx="${cx.toFixed(0)}" cy="${baseY+16}" r="13" fill="#0a1017" stroke="${accOf(i)}" stroke-width="2.2"/>
      <text x="${cx.toFixed(0)}" y="${baseY+21}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${i+1}</text></g>
      <text x="${cx.toFixed(0)}" y="${baseY+70}" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#a3b4c5">${s.tempoLabels[i]}</text>`;
  }
  const line = Array.from({length:n},(_,i)=>[x0+(i+.5)*colW, baseY - 6 - s.energy[i]*0]);

  return `<svg viewBox="0 0 ${W} ${baseY+92}" xmlns="http://www.w3.org/2000/svg" font-family="Inter" role="img"
      aria-label="Six strata removed one at a time across five stages, 130 down to 112 BPM">
    <defs>${defs}</defs>
    <g class="fade-late">${bands}${cols}</g>
    <path class="draw" pathLength="1" d="M${x0} ${baseY} L${(x0+span).toFixed(0)} ${baseY}" stroke="rgba(255,255,255,.16)" stroke-width="1.4" stroke-dasharray="1"/>
    <g class="fade-late">${nodes}

}

/* ============================ chart: genre stream ============================ */
function streamSVG(s){
  const n = s.stages.length, H2 = 296, x0 = 10, span = W - 20;
  const xs = Array.from({length:n},(_,i)=> x0 + i*span/(n-1));
  const midY = 112, unit = 1.66;           /* 100 % ≈ 166 units tall */
  const totals = Array.from({length:n},(_,i)=> s.mix.reduce((a,g)=>a+g.share[i],0));

  /* cumulative offsets, centred */
  const offs = s.mix.map(()=>[]);
  for (let i=0;i<n;i++){
    let acc = -totals[i]/2;
    s.mix.forEach((g,j)=>{ offs[j][i] = acc; acc += g.share[i]; });
  }

  let bands = '', labels = '';
  s.mix.forEach((g,j)=>{
    const topPts = xs.map((x,i)=>[x, midY + offs[j][i]*unit]);
    const botPts = xs.map((x,i)=>[x, midY + (offs[j][i]+g.share[i])*unit]);
    const dBot = smooth([...botPts].reverse());
    const shape = smooth(topPts) + ' ' + dBot.replace(/^M/, 'L') + ' Z';
    bands += `<path d="${shape}" fill="${g.color}" fill-opacity=".52" stroke="#06090e" stroke-opacity=".55" stroke-width="2.4"/>
      <path d="${smooth(topPts)}" fill="none" stroke="${g.color}" stroke-opacity=".95" stroke-width="2"/>`;
    /* label where the band is thickest */
    let best = 0;
    g.share.forEach((v,i)=>{ if (v > g.share[best]) best = i; });
    if (g.share[best] >= 20){
      const ly = midY + (offs[j][best] + g.share[best]/2)*unit;
      const lx = clamp(xs[best], 92, W-92);
      labels += `<text x="${lx.toFixed(0)}" y="${(ly+5).toFixed(0)}" text-anchor="middle" font-size="16" font-weight="700"
        fill="#fff" stroke="#06090e" stroke-width="3.5" stroke-opacity=".5" paint-order="stroke" letter-spacing=".01em">${g.name}</text>`;
    }
  });

  let nodes = '';
  xs.forEach((x,i)=>{
    const st = s.stages[i];
    nodes += `<path class="guide" data-i="${i}" d="M${x.toFixed(0)} 14 L${x.toFixed(0)} 206" stroke="rgba(255,255,255,.12)" stroke-width="1" stroke-dasharray="4 5"/>
      <g class="node" data-i="${i}" style="color:${st.acc}" role="button" tabindex="0" aria-label="Stage ${i+1}: ${st.title}">
        <circle class="nc" cx="${x.toFixed(0)}" cy="224" r="13" fill="#0a1017" stroke="${st.acc}" stroke-width="2.2"/>
        <text x="${x.toFixed(0)}" y="229" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${i+1}</text></g>
      <text x="${x.toFixed(0)}" y="278" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#a3b4c5">${s.tempoLabels[i]}</text>`;
  });

  const spine = smooth(xs.map((x,i)=>[x, midY + (offs[0][i])*unit]));

  return `<svg viewBox="0 0 ${W} ${H2}" xmlns="http://www.w3.org/2000/svg" font-family="Inter" role="img"
      aria-label="Genre share drifting from Rominimal to Electro across five stages">
    <g class="fade-late">${bands}${labels}</g>
    <path class="draw" pathLength="1" d="${spine}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.6" stroke-dasharray="1"/>
    <g class="fade-late">${nodes}</g>
  </svg>`;
}

const CHART = {curve:curveSVG, step:curveSVG, wheel:wheelSVG, strata:strataSVG, stream:streamSVG, blend:blendSVG};

/* ============================ glyphs & overview ============================ */
function shapePath(s, w, h, pad){
  if (s.form === 'blend'){
    const y1 = h-pad, y2 = pad+ (h-2*pad)*.35;
    return `M${pad} ${y1} L${w*.48} ${y1} M${w*.44} ${y2} L${w-pad} ${y2}`;
  }
  const e = s.energy, n = e.length;
  const pts = e.map((v,i)=>[pad + i*(w-2*pad)/(n-1), (h-pad) - v*(h-2*pad)]);
  if (s.form === 'step'){
    let d = '';
    pts.forEach((p,i)=>{
      const half = (w-2*pad)/(n-1)/2;
      const a = Math.max(pad, p[0]-half*.8), b = Math.min(w-pad, p[0]+half*.8);
      d += (i?` L${a.toFixed(1)} ${p[1].toFixed(1)}`:`M${a.toFixed(1)} ${p[1].toFixed(1)}`);
      d += ` L${b.toFixed(1)} ${p[1].toFixed(1)}`;
    });
    return d;
  }
  return smooth(pts);
}
function glyph(s){
  return `<svg class="tg" viewBox="0 0 26 11" aria-hidden="true"><path d="${shapePath(s,26,11,1.6)}"
    fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function sparkline(s){
  const w = 300, h = 52;
  const acc = s.stages ? s.stages.map(st=>st.acc) : [C.green, C.cyan, C.pink];
  const stops = acc.map((c,i)=>`<stop offset="${(i/(acc.length-1)*100).toFixed(0)}%" stop-color="${c}"/>`).join('');
  const dots = (s.energy||[]).map((v,i)=>{
    const n = s.energy.length, x = 6 + i*(w-12)/(n-1), y = (h-6) - v*(h-12);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="#0a1017" stroke="${acc[i]||acc[acc.length-1]}" stroke-width="1.8"/>`;
  }).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs><linearGradient id="sp${s.n}" x1="0" y1="0" x2="${w}" y2="0" gradientUnits="userSpaceOnUse">${stops}</linearGradient></defs>
    <path d="${shapePath(s,w,h,6)}" stroke="url(#sp${s.n})" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function accentOf(s){ return s.stages ? s.stages[Math.floor(s.stages.length/2)].acc : s.acc; }

function overviewHTML(){
  let i = 0;
  const groups = GROUPS.map(g=>{
    const cards = g.keys.map(k=>{
      const s = BY_KEY[k]; i++;
      return `<button class="ovcard reveal" type="button" data-key="${s.key}" style="--i:${i};--acc:${accentOf(s)}">
        <div class="ovtop"><span class="no">SCHEME #${s.n}</span><span class="ovshape">${s.shape}</span></div>
        <h3>${s.titleA}${s.titleB}</h3>
        <p class="ovs">${s.sub.replace(/<\/?b>/g,'')}</p>
        ${sparkline(s)}
        <div class="ovmeta"><span>Tempo <b>${s.tempoSpan}</b></span><span>${s.stages?s.stages.length+' stages':'2 tracks'}</span></div>
      </button>`;
    }).join('');
    return `<section class="group"><div class="grouphead reveal"><h2>${g.name}</h2><p>${g.note}</p></div>
      <div class="ov">${cards}</div></section>`;
  }).join('');

  return `<div class="titleline reveal"><h1>Ten ways to <span class="grad" style="background-image:linear-gradient(95deg,#5eead4,#38bdf8 55%,#f472b6)">build a set</span></h1></div>
    <p class="sub reveal">Each scheme is a different dramaturgy over the same engine: a <b>text prompt</b> says what it should feel like, an <b>audio embedding</b> says how it sounds, and <b>SONARA</b> checks whether it actually fits. Pick one to see its stages.</p>
    ${groups}
    <p class="ovhint reveal">Hover a stage card inside a scheme to light up its point on the chart — or click a point to jump to the card.</p>`;
}

/* ============================ init ============================ */
const tabsEl = document.getElementById('tabs'), viewsEl = document.getElementById('views');
const items = [{key:'overview', n:0, tabName:'Overview'}, ...SCHEMES];

items.forEach(s=>{

/* cross-highlight between chart nodes and stage cards */
function wire(view){
  const cards  = [...view.querySelectorAll('.card[data-i]')];
  const nodes  = [...view.querySelectorAll('.node')];
  const guides = [...view.querySelectorAll('.guide')];
  const setHot = (i, on) => {
    nodes.forEach(nd=>{
      const same = +nd.dataset.i === i;
      nd.classList.toggle('hot', on && same);
      nd.classList.toggle('dim', on && !same);
    });
    guides.forEach(g=> g.classList.toggle('hot', on && +g.dataset.i === i));
    cards.forEach(c=> c.classList.toggle('dim', on && +c.dataset.i !== i));
  };
  const jump = i => {
    const c = cards[i]; if (!c) return;
    c.scrollIntoView({behavior:'smooth', block:'center'});
    c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'), 900);
  };
  cards.forEach(c=>{
    const i = +c.dataset.i;
    c.addEventListener('mouseenter', ()=>setHot(i,true));
    c.addEventListener('focus',      ()=>setHot(i,true));
    c.addEventListener('mouseleave', ()=>setHot(i,false));
    c.addEventListener('blur',       ()=>setHot(i,false));
  });
  nodes.forEach(nd=>{
    const i = +nd.dataset.i;
    nd.addEventListener('mouseenter', ()=>setHot(i,true));
    nd.addEventListener('mouseleave', ()=>setHot(i,false));
    nd.addEventListener('focus',      ()=>setHot(i,true));
    nd.addEventListener('blur',       ()=>setHot(i,false));
    nd.addEventListener('click', ()=>jump(i));
    nd.addEventListener('keydown', e=>{
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); jump(i); }
    });
  });
  view.querySelectorAll('.ovcard').forEach(b=> b.addEventListener('click', ()=>show(b.dataset.key)));
}
[...viewsEl.children].forEach(wire);

function show(key, focusTab){
  const valid = items.some(s=>s.key===key) ? key : 'overview';
  [...viewsEl.children].forEach(v=>{
    const on = v.dataset.key === valid;
    v.hidden = !on;
    v.classList.remove('live');
    if (on){ void v.offsetWidth; v.classList.add('live'); }   /* restart the reveal */
  });
  [...tabsEl.children].forEach(t=>{
    const on = t.dataset.key === valid;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
    if (on && focusTab) t.focus();
  });
  if (location.hash.slice(1) !== valid) history.replaceState(null,'','#'+valid);
  window.scrollTo({top:0, behavior:'auto'});
}

/* tablist keyboard model */
tabsEl.addEventListener('keydown', e=>{
  const keys = items.map(s=>s.key);
  const cur = keys.indexOf(document.activeElement?.dataset?.key);
  if (cur < 0) return;
  let next = null;
  if (e.key === 'ArrowRight') next = (cur+1) % keys.length;
  else if (e.key === 'ArrowLeft') next = (cur-1+keys.length) % keys.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = keys.length-1;
  if (next === null) return;
  e.preventDefault(); e.stopPropagation();
  show(keys[next], true);
});

/* page-level arrows, only when focus is not in a control */
document.addEventListener('keydown', e=>{
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const el = document.activeElement;
  if (el && el.closest('#tabs, input, textarea, select')) return;
  const cur = items.findIndex(s=>s.key===(location.hash.slice(1)||'overview'));
  show(items[(cur + (e.key==='ArrowRight'?1:-1) + items.length) % items.length].key);
});

window.addEventListener('hashchange', ()=>show(location.hash.slice(1)));
show(location.hash.slice(1) || 'overview');
</script>

</style>
