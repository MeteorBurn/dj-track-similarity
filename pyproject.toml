[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-track-similarity"
version = "0.1.0"
description = "Local DJ track similarity utility for seamless set preparation."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "mutagen>=1.47",
  "pydantic>=2",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "joblib>=1.3",
  "av==17.1.0",
]

[project.optional-dependencies]
ann = [
  "hnswlib>=0.8",
]
sonara = [
  "sonara==0.3.5",
]
ml = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
  "torchcodec @ https://download.pytorch.org/whl/cu130/torchcodec-0.16.0%2Bcu130-cp310-cp310-win_amd64.whl#sha256=844127b758d7f0e3e54a7e467ac85eb74c02743554cc8d8c346d91c9f7dd63c4 ; python_version == '3.10' and sys_platform == 'win32' and platform_machine == 'AMD64'",
  "torchcodec==0.16.0 ; python_version != '3.10' or sys_platform != 'win32' or platform_machine != 'AMD64'",
  "nnaudio",
  "transformers==5.13.0",
  "huggingface-hub==1.22.0",
  "laion-clap==1.1.7",
  "maest-infer==0.2.0",
  "muq==0.1.0",
]
rhythm-lab = [
  "scikit-learn>=1.4",
]
dev = [
  "httpx2>=2.0.0",
  "pytest>=7.4",
  "ruff>=0.8",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "python_version == '3.10' and sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "python_version == '3.10' and sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "python_version == '3.10' and sys_platform == 'win32' and platform_machine == 'AMD64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
dj-sim = "dj_track_similarity.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dj_track_similarity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ml: requires torch / optional ML stack",
  "slow: long-running integration/benchmark tests",
  "evaluation: retrieval/evaluation layer",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
