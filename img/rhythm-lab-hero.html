<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Rhythm Lab — hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#ffc447;
    --amber-deep:#f0a51e;
    --ink:#0c161d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#05080d}
  .stage{
    position:relative;width:1792px;height:896px;overflow:hidden;
    background:
      radial-gradient(1180px 620px at 50% 30%, rgba(255,196,71,.115), transparent 62%),
      radial-gradient(760px 420px at 50% 16%, rgba(255,196,71,.10), transparent 68%),
      radial-gradient(1500px 780px at 50% 104%, rgba(255,166,40,.085), transparent 66%),
      radial-gradient(1100px 700px at 50% 44%, #0d1a23, transparent 72%),
      #05080d;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }

  /* faint studio grid — the surface the wordmark sits on */
  .grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,196,71,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,196,71,.055) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(900px 560px at 50% 34%, #000 8%, rgba(0,0,0,.35) 52%, transparent 78%);
    mask-image:radial-gradient(900px 560px at 50% 34%, #000 8%, rgba(0,0,0,.35) 52%, transparent 78%)}

  /* ---- mark ---- */
  .mark{position:absolute;top:118px;left:50%;transform:translateX(-50%);width:132px;height:56px;
    filter:drop-shadow(0 0 18px rgba(255,196,71,.55)) drop-shadow(0 0 46px rgba(255,166,40,.3))}
  .mark svg{display:block;width:100%;height:100%}

  /* ---- wordmark ---- */
  .word{position:absolute;top:206px;left:0;right:0;text-align:center;
    font-size:134px;font-weight:800;letter-spacing:-.026em;line-height:1;
    background:linear-gradient(180deg,#fffdf8 8%,#ffeecb 52%,#ffd486 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 40px rgba(255,196,71,.34)) drop-shadow(0 14px 44px rgba(0,0,0,.65))}

  .sub{position:absolute;top:410px;left:0;right:0;text-align:center;
    font-size:27px;font-weight:600;letter-spacing:.46em;text-indent:.46em;color:#eaf0f6;
    text-shadow:0 0 26px rgba(255,196,71,.28)}

  /* ---- perspective deck ---- */
  .deckglow{position:absolute;left:50%;top:500px;width:1620px;height:400px;transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(255,178,56,.34), rgba(255,178,56,.10) 55%, transparent 78%);
    filter:blur(24px)}
  .deck{position:absolute;left:50%;top:452px;width:1700px;height:560px;transform:translateX(-50%);
    perspective:1700px;perspective-origin:50% -10%}
  .slab{position:absolute;left:0;top:0;width:1700px;border-radius:13px;display:block;
    border:1px solid rgba(255,255,255,.075);
    box-shadow:0 44px 96px rgba(0,0,0,.7);
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 70%,rgba(0,0,0,.4) 92%,transparent 100%);
    mask-image:linear-gradient(180deg,#000 0%,#000 70%,rgba(0,0,0,.4) 92%,transparent 100%)}
  .slab.back{transform:rotateX(33deg) rotateZ(-1.1deg) translate3d(378px,-76px,-230px);opacity:.72;
    filter:saturate(.7) brightness(.66);border-color:rgba(255,255,255,.13)}
  .slab.front{transform:rotateX(33deg) rotateZ(-1.1deg);filter:brightness(1.1) contrast(1.03)}

  /* horizon: the deck dissolves into the background at both sides and the floor */
  .fade{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg,#05080d 0%, rgba(5,8,13,.55) 5%, transparent 17%, transparent 83%, rgba(5,8,13,.55) 95%, #05080d 100%),
      linear-gradient(180deg, transparent 80%, rgba(5,8,13,.38) 93%, rgba(5,8,13,.78) 100%)}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1500px 980px at 50% 40%, transparent 54%, rgba(0,0,0,.42) 100%)}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>

  <div class="mark">
    <svg viewBox="0 0 132 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 30 H26 L34 30 L41 17 L50 44 L60 6 L70 40 L77 26 L84 30 H130"
            stroke="#ffc447" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="word">RHYTHM LAB</div>
  <div class="sub">LABEL · TRAIN · PROMOTE</div>

  <div class="deckglow"></div>
  <div class="deck">
    <img class="slab back"  src="rhythm-lab-training.png" alt="">
    <img class="slab front" src="rhythm-lab-break-energy.png" alt="">
  </div>

  <div class="fade"></div>
  <div class="vignette"></div>
</div>
</body>
</html>
