<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/static/styles.css?v=rhythm-lab-20260915-en" />
  <script src="/static/app.js?v=rhythm-lab-20260915-en" defer></script>
  <title>Rhythm Lab</title>
</head>
<body>
  <header class="app-shell">
    <div class="top-bar">
      <div class="brand">
        <strong>Rhythm Lab</strong>
        <button id="shutdownLab" type="button" class="icon-button danger-button stop-button" title="Stop Rhythm Lab" aria-label="Stop Rhythm Lab">
          <svg class="lucide lucide-power" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v10" />
            <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />
          </svg>
        </button>
      </div>
      <div class="source-row">
        <input id="sourcePath" class="source-path" placeholder="C:\db\library.sqlite" aria-label="Library database" title="An existing dj-track-similarity SQLite library. It opens read-only." />
        <button id="chooseSource" type="button" title="Choose an existing SQLite library">Browse</button>
        <button id="loadSource" type="button" title="Open the selected library">Load library</button>
      </div>
      <div class="profile-controls">
        <select id="profileSelect" aria-label="Classifier profile" title="Active classifier profile"></select>
        <button id="newProfile" type="button">New profile</button>
        <button id="settingsTab" type="button">Profile settings</button>
        <button id="deleteProfile" type="button" class="danger-button">Delete</button>
      </div>
    </div>

    <div class="view-bar">
      <nav class="tabs" aria-label="Views">
        <button id="libraryTab" type="button" class="tab-button active">
          <svg class="lucide lucide-library-big" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="8" height="18" x="3" y="3" rx="1" />
            <path d="M7 3v18" />
            <path d="M20.4 18.9c.2.7-.2 1.4-.9 1.6l-3.7 1c-.7.2-1.4-.2-1.6-.9L9.1 5.1c-.2-.7.2-1.4.9-1.6l3.7-1c.7-.2 1.4.2 1.6.9Z" />
          </svg>
          Library
        </button>
        <button id="candidatesTab" type="button" class="tab-button">
          <svg class="lucide lucide-sparkles" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594Z" />
            <path d="M20 2v4" />
            <path d="M22 4h-4" />
            <circle cx="4" cy="20" r="2" />
          </svg>
          Candidates
        </button>
        <button id="collectionTab" type="button" class="tab-button">
          <svg class="lucide lucide-list-checks" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 17 2 2 4-4" />
            <path d="M13 6h8" />
            <path d="M13 12h8" />
            <path d="M13 18h8" />
            <path d="m3 7 2 2 4-4" />
          </svg>
          Collection
        </button>
        <button id="trainingTab" type="button" class="tab-button">
          <svg class="lucide lucide-brain" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
          </svg>
          Training
        </button>
      </nav>
      <span id="collectionControls" class="collection-controls" hidden>
        <select id="collectionSelect" aria-label="Review collection" title="Review collection"></select>
        <button id="deleteCollection" type="button" class="icon-button danger-button" title="Delete the selected collection. Labels stay in the active profile." aria-label="Delete the selected collection">
          <svg class="lucide lucide-trash-2" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M3 6h18" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
        <span id="collectionStatus" class="meta"></span>
      </span>
      <div id="summary" class="summary-strip">
        <span id="summaryCoverage"></span>
        <span id="summaryLabels"></span>
      </div>
    </div>

    <div id="listBar" class="list-bar">
      <div class="filters">
        <input id="query" type="search" placeholder="Search path, title or artist" aria-label="Search tracks" />
        <input id="bpmMin" type="number" min="0" step="0.1" placeholder="BPM from" aria-label="Minimum BPM" title="Minimum SONARA BPM. Leave empty for no lower bound." />
        <input id="bpmMax" type="number" min="0" step="0.1" placeholder="BPM to" aria-label="Maximum BPM" title="Maximum SONARA BPM. Leave empty for no upper bound." />
        <select id="label" aria-label="Label filter"></select>
        <select id="libraryOrder" aria-label="Library order" title="Library order">
          <option value="normal" selected>Normal order</option>
          <option value="random">Random order</option>
        </select>
        <button id="shuffleLibraryOrder" type="button" class="icon-button" title="Shuffle the random order" aria-label="Shuffle the random order">
          <svg class="lucide lucide-shuffle" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 14 4 4-4 4" />
            <path d="m18 2 4 4-4 4" />
            <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7L14 7.7C14.8 6.6 16 6 17.4 6H22" />
            <path d="M2 6h1.9c.7 0 1.4.3 1.9.8L8 9" />
            <path d="M11.7 14.9 14 16.3c.8 1.1 2 1.7 3.4 1.7H22" />
          </svg>
        </button>
        <select id="candidatePredicted" aria-label="Prediction filter"></select>
        <select id="candidateMinBroken" aria-label="Candidate order">
          <option value="positive_highest" selected>Highest positive probability</option>
          <option value="negative_highest">Highest negative probability</option>
          <option value="balanced">Uncertain first</option>
        </select>
        <input id="candidateMinPositive" type="number" min="0" max="1" step="0.05" value="0" aria-label="Minimum positive probability" title="Minimum positive probability" />
      </div>
      <div class="pager">
        <select id="pageSize" aria-label="Tracks per page">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
        <button id="prevPage" type="button">Previous</button>
        <button id="nextPage" type="button">Next</button>
        <input id="pageNumber" class="page-number" type="number" min="1" step="1" value="1" aria-label="Page number" title="Page number" />
        <button id="load" type="button" title="Reload this view">Reload</button>
        <span id="pageInfo" class="meta"></span>
      </div>
    </div>
  </header>

  <main>
    <section id="guidancePanel" class="status-strip" aria-label="Profile status"></section>
    <section id="settingsPanel" class="settings-panel" hidden>
      <div class="settings-grid">
        <form id="profileForm" class="tool-panel">
          <h2>Profile</h2>
          <label>Name <input id="profileNameInput" /></label>
          <label>Description <textarea id="profileDescriptionInput"></textarea></label>
          <label>Artifact prefix <input id="profileArtifactPrefixInput" /></label>
          <label>New labels per class before retraining <input id="profileTrainingMinAddedInput" type="number" min="1" step="1" value="50" /></label>
          <label>Minimum labels per class for training <input id="profileTrainingMinLabelsInput" type="number" min="2" step="1" value="100" /></label>
          <button type="submit">Save profile</button>
        </form>
        <form id="renameLabelForm" class="tool-panel">
          <h2>Rename label key</h2>
          <label>Current label <select id="renameLabelSelect"></select></label>
          <label>New key <input id="renameLabelKeyInput" placeholder="lead_vocal" /></label>
          <label>Display name <input id="renameLabelNameInput" placeholder="Lead vocal" /></label>
          <button type="submit">Rename label</button>
        </form>
      </div>
    </section>
    <section id="trainingPanel" class="training-panel" hidden></section>
    <section id="tracks"></section>
  </main>

  <dialog id="profileDialog">
    <form id="newProfileForm" method="dialog" class="dialog-form">
      <h2>New classifier profile</h2>
      <label>Key <input id="newProfileKey" placeholder="vocal_presence" required /></label>
      <label>Name <input id="newProfileName" placeholder="Vocal presence" required /></label>
      <label>Type
        <select id="newProfileType">
          <option value="binary" selected>Binary</option>
          <option value="multiclass">Multiclass</option>
        </select>
      </label>
      <label>Description <textarea id="newProfileDescription" placeholder="What this classifier should recognize"></textarea></label>
      <label>New labels per class before retraining <input id="newProfileTrainingMinAdded" type="number" min="1" step="1" value="50" required /></label>
      <label>Minimum labels per class for training <input id="newProfileTrainingMinLabels" type="number" min="2" step="1" value="100" required /></label>
      <div id="binaryLabelGrid" class="label-grid">
        <label>Positive label key <input id="newPositiveKey" placeholder="vocal" required /></label>
        <label>Positive label name <input id="newPositiveName" placeholder="Vocal" required /></label>
        <label>Negative label key <input id="newNegativeKey" placeholder="instrumental" required /></label>
        <label>Negative label name <input id="newNegativeName" placeholder="Instrumental" required /></label>
        <label>Review label key <input id="newReviewKey" placeholder="uncertain" /></label>
        <label>Review label name <input id="newReviewName" placeholder="Uncertain" /></label>
      </div>
      <div id="multiclassLabelEditor" class="multiclass-label-editor" hidden>
        <div id="multiclassLabelRows" class="multiclass-label-rows">
          <div class="multiclass-label-row">
            <label>Class key <input class="multiclass-label-key" placeholder="euphoric" /></label>
            <label>Class name <input class="multiclass-label-name" placeholder="Euphoric" /></label>
            <label>Description <textarea class="multiclass-label-description" placeholder="Bright, uplifting, hands-in-the-air mood"></textarea></label>
          </div>
          <div class="multiclass-label-row">
            <label>Class key <input class="multiclass-label-key" placeholder="dark" /></label>
            <label>Class name <input class="multiclass-label-name" placeholder="Dark" /></label>
            <label>Description <textarea class="multiclass-label-description" placeholder="Dark, tense, low-light mood"></textarea></label>
          </div>
        </div>
        <button id="addMulticlassLabel" type="button">Add class</button>
      </div>
      <menu>
        <button id="cancelProfileButton" type="button" value="cancel">Cancel</button>
        <button id="createProfileButton" type="submit" value="default">Create profile</button>
      </menu>
    </form>
  </dialog>
</body>
</html>
